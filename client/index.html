<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>DigiCommune</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1d2b1d;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      input, button {
        font-size: 16px; /* 16px stops iPhones from zooming in on focus */
      }
      input {
        -webkit-user-select: text;
        user-select: text;
      }

      /* Shows a message if the game fails to start (helps debugging on phones) */
      #boot-error {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        margin: 0;
        padding: 10px;
        background: #7a1f1f;
        color: #fff;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* Login / sign up screen */
      #auth {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #1d2b1d;
        z-index: 20;
      }
      #auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(330px, 86vw);
        padding: 24px;
        border-radius: 12px;
        background: #243824;
        color: #fff;
      }
      #auth-form h1 { margin: 0; font-size: 24px; }
      #auth-form input {
        padding: 10px;
        border-radius: 8px;
        border: none;
      }
      #auth-form .tabs { display: flex; gap: 6px; }
      #auth-form .tab {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #33503a;
        color: #fff;
        cursor: pointer;
      }
      #auth-form .tab.active { background: #5cb85c; font-weight: bold; }
      #auth-error { margin: 0; min-height: 18px; font-size: 14px; color: #ffb3b3; }
      #auth-note { margin: 0; font-size: 12px; opacity: 0.7; }
      #auth-submit {
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #5cb85c;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
      #auth-submit:disabled { opacity: 0.6; cursor: default; }

      /* Top right buttons (under the status text) */
      #topbar {
        position: fixed;
        top: calc(34px + env(safe-area-inset-top));
        right: 10px;
        display: none;
        gap: 6px;
        z-index: 10;
      }
      #topbar button {
        padding: 4px 10px;
        border-radius: 6px;
        border: none;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }

      /* Wardrobe: side panel on desktop, bottom sheet on phones */
      #wardrobe {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 320px;
        display: none;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        box-sizing: border-box;
        background: rgba(24, 38, 24, 0.96);
        color: #fff;
        z-index: 15;
        touch-action: pan-y;
      }
      #wardrobe-head { display: flex; align-items: center; gap: 12px; }
      #wardrobe-title { font-size: 18px; font-weight: bold; }
      #wardrobe-preview {
        width: 72px;
        height: 96px;
        image-rendering: pixelated;
        background: #33503a;
        border-radius: 8px;
      }
      #wardrobe-body {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        -webkit-overflow-scrolling: touch;
      }
      .w-label { font-size: 13px; opacity: 0.8; margin-bottom: 4px; }
      .w-options { display: flex; flex-wrap: wrap; gap: 6px; }
      .w-btn {
        padding: 6px 10px;
        border-radius: 8px;
        border: 2px solid transparent;
        background: #33503a;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      .w-btn.selected { border-color: #fff; background: #5cb85c; }
      .w-swatch {
        width: 30px;
        height: 30px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
      }
      .w-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px #5cb85c; }
      #wardrobe-error { margin: 0; min-height: 16px; font-size: 13px; color: #ffb3b3; }
      #wardrobe-actions { display: flex; gap: 8px; }
      #wardrobe-actions button {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      #wardrobe-save { background: #5cb85c; color: #fff; }
      #wardrobe-save:disabled { opacity: 0.6; cursor: default; }
      #wardrobe-cancel { background: #4a4a4a; color: #fff; }
      @media (max-width: 700px) {
        #wardrobe {
          top: auto;
          left: 0;
          width: 100%;
          height: 56vh;
          height: 56dvh;
          border-radius: 16px 16px 0 0;
          padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
      }

      /* Chat bar */
      #chat {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: min(440px, 92vw);
        display: none;
        gap: 6px;
        z-index: 10;
      }
      #chat-input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border-radius: 8px;
        border: none;
        background: rgba(255, 255, 255, 0.9);
      }
      #chat-send {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: #5cb85c;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
    <script>
      // Plain old JavaScript on purpose, so it runs even on very old browsers.
      (function () {
        var started = false;
        window.__dcStarted = function () { started = true; };
        function show(msg) {
          var d = document.getElementById('boot-error');
          if (!d) return;
          d.style.display = 'block';
          d.textContent = msg;
        }
        window.addEventListener('error', function (e) {
          var where = e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '';
          show('Error: ' + (e.message || 'unknown') + where);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Error: ' + (r && r.message ? r.message : String(r)));
        });
        setTimeout(function () {
          if (!started) {
            show('The game did not start. Your browser may be too old, or the page could not load fully. Try reloading, or send this message to your helper.');
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <pre id="boot-error"></pre>
    <div id="game"></div>

    <div id="auth">
      <form id="auth-form">
        <h1>DigiCommune</h1>
        <div class="tabs">
          <button type="button" id="tab-login" class="tab active">Log in</button>
          <button type="button" id="tab-signup" class="tab">Sign up</button>
        </div>
        <input id="auth-username" type="text" maxlength="16" placeholder="Username"
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <input id="auth-password" type="password" placeholder="Password (8+ characters)"
               autocomplete="current-password" />
        <input id="auth-password2" type="password" placeholder="Confirm password"
               autocomplete="new-password" style="display: none" />
        <p id="auth-error"></p>
        <button id="auth-submit" type="submit">Log in</button>
        <p id="auth-note">Usernames: 3-16 letters, numbers, or underscores.</p>
      </form>
    </div>

    <div id="topbar">
      <button id="wardrobe-btn" type="button">Wardrobe</button>
      <button id="logout" type="button">Log out</button>
    </div>

    <div id="wardrobe">
      <div id="wardrobe-head">
        <canvas id="wardrobe-preview" width="24" height="32"></canvas>
        <div id="wardrobe-title">Wardrobe</div>
      </div>
      <div id="wardrobe-body"></div>
      <p id="wardrobe-error"></p>
      <div id="wardrobe-actions">
        <button id="wardrobe-cancel" type="button">Cancel</button>
        <button id="wardrobe-save" type="button">Save</button>
      </div>
    </div>

    <div id="chat">
      <input id="chat-input" type="text" maxlength="120" placeholder="Press Enter to chat" autocomplete="off" />
      <button id="chat-send" type="button">Send</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
